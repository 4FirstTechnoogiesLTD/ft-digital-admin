# Runs the built admin app. Data (Postgres, Auth, Storage, Realtime) lives in
# Supabase — copy `.env.example` to `.env` and fill it in FIRST, then:
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up --build
#
# All config is read at RUNTIME from .env (the browser gets SUPABASE_URL /
# SUPABASE_ANON_KEY via a small inline bootstrap in the page head), so the
# image is env-agnostic — no rebuild needed when values change.

services:
  admin:
    build:
      context: .
    image: ft-digital-admin
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
    restart: unless-stopped
